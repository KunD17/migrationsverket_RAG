[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationsverket-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "chromadb==0.4.22",
    "langdetect==1.0.9",
    "lxml==5.1.0",
    "pandas==2.1.4",
    "requests==2.31.0",
    "streamlit==1.31.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["migrationsverket_bot*"]